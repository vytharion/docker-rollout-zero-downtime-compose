[project]
name = "docker-rollout-zero-downtime-compose"
version = "0.1.0"
description = "Companion code for a zero-downtime docker-compose rollout tutorial"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
