services:
  app:
    build:
      context: ./app
    environment:
      APP_PORT: "8000"
      APP_VERSION: "v1"
    expose:
      - "8000"
    networks:
      - edge
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    driver: bridge
